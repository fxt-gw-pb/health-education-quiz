<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>健教选择题库</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* 布局：左侧一张题卡，右侧一张答题卡；窄屏时答题卡落到题卡下方。 */
:root {
  --bg: #F2F4F8;
  --surface: #FFFFFF;
  --ink: #18202B;
  --muted: #5A6473;
  --line: #D8DDE6;
  --accent: #2B4C9B;
  --accent-soft: #E5EBF8;
  --ok: #1B7A4B;
  --ok-soft: #E2F3E9;
  --bad: #B3312B;
  --bad-soft: #FBE8E6;
  --warn: #855600;
  --warn-soft: #FAF0D8;
  --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-paper: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --font-num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151B; --surface: #1A2029; --ink: #E6EAF0; --muted: #98A2B3; --line: #2D3643;
    --accent: #8FADF5; --accent-soft: #212D48;
    --ok: #5CC892; --ok-soft: #15301F; --bad: #F08A80; --bad-soft: #3A1B19;
    --warn: #E0B34F; --warn-soft: #33290F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151B; --surface: #1A2029; --ink: #E6EAF0; --muted: #98A2B3; --line: #2D3643;
  --accent: #8FADF5; --accent-soft: #212D48;
  --ok: #5CC892; --ok-soft: #15301F; --bad: #F08A80; --bad-soft: #3A1B19;
  --warn: #E0B34F; --warn-soft: #33290F;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.6; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 68rem; margin: 0 auto; padding-inline: 16px; padding-block: 1.25rem 3rem; display: flex; flex-direction: column; gap: 1rem; }

.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .25rem 1.5rem; }
.top h1 { margin: 0; font-family: var(--font-paper); font-weight: 700; font-size: 1.3rem; line-height: 1.3; text-wrap: balance; }
.score { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.score b { color: var(--ink); font-weight: 600; }
.score span + span { margin-left: 1em; }
.bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }

.filters { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }
.filters select { min-width: 0; max-width: 100%; height: 2.3rem; padding: 0 .6rem; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.seg { display: flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px; gap: 2px; }
.seg button, .tog { height: 2.3rem; padding: 0 .7rem; border: 0; border-radius: 4px; background: transparent; white-space: nowrap; }
.seg button { height: calc(2.3rem - 6px); }
.seg button small { color: var(--muted); font-size: .8em; margin-left: .3em; font-variant-numeric: tabular-nums; }
.seg button[aria-checked="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg button[aria-checked="true"] small { color: inherit; }
.togs { display: flex; gap: .6rem; margin-left: auto; }
.tog { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.tog[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 600; }

.work { display: grid; grid-template-columns: minmax(0, 1fr) 19rem; gap: 1.25rem; align-items: start; }
@media (max-width: 860px) { .work { grid-template-columns: minmax(0, 1fr); } .togs { margin-left: 0; } }

.card { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 1.25rem 1.5rem 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
@media (max-width: 520px) { .card { padding: 1rem; } }
.qhead { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .6rem; color: var(--muted); font-size: .87rem; }
.qid { font-family: var(--font-num); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.tag { padding: 0 .45em; border: 1px solid var(--line); border-radius: 3px; font-size: .8rem; line-height: 1.55; white-space: nowrap; }
.tag.multi { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
.tag.y24 { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.tag.dispute { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.star { margin-left: auto; border: 0; background: transparent; color: var(--muted); padding: .1rem .3rem; border-radius: 4px; white-space: nowrap; }
.star[aria-pressed="true"] { color: var(--warn); font-weight: 600; }
.stem { margin: 0; font-family: var(--font-paper); font-weight: 500; font-size: 1.2rem; line-height: 1.7; overflow-wrap: anywhere; }

.opts { display: flex; flex-direction: column; gap: .5rem; }
.opt { display: flex; align-items: flex-start; gap: .75rem; width: 100%; text-align: left; padding: .6rem .75rem; background: transparent; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); }
.opt:disabled { color: var(--ink); opacity: 1; }
.opt:not(:disabled):hover { border-color: var(--accent); background: var(--accent-soft); }
.bub { flex: none; width: 1.9rem; height: 1.45rem; margin-top: .1rem; display: grid; place-items: center; border: 1.5px solid var(--ink); border-radius: 3px; font-family: var(--font-num); font-size: .85rem; font-weight: 600; line-height: 1; }
.txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.mk { flex: none; width: 1em; font-weight: 700; }
.opt.on { border-color: var(--ink); }
.opt.on .bub { background: var(--ink); color: var(--surface); }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.right .bub { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.right .mk { color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt.wrong .bub { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt.wrong .mk { color: var(--bad); }
.opt.gap, .opt.gap:disabled { color: var(--muted); border-style: dashed; }
.opt.gap .bub { border-color: var(--muted); }

.fb { margin: 0; font-weight: 600; }
.fb.ok { color: var(--ok); }
.fb.bad { color: var(--bad); }
.fb.none { color: var(--muted); font-weight: 400; }
.fb b { font-family: var(--font-num); letter-spacing: .08em; }
.note { margin: 0; font-size: .9rem; color: var(--muted); }
.note.warn { background: var(--warn-soft); color: var(--warn); padding: .5rem .75rem; border-radius: 6px; }
.fbwrap { display: flex; flex-direction: column; gap: .5rem; }

.acts { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; padding-top: 1rem; border-top: 1px solid var(--line); }
.acts button { height: 2.4rem; padding: 0 1rem; background: transparent; border: 1px solid var(--line); border-radius: 6px; white-space: nowrap; }
.acts button:disabled { color: var(--muted); opacity: .55; }
.acts button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
.acts .pos { margin-left: auto; color: var(--muted); font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: .87rem; }
.empty { margin: 2rem 0; text-align: center; color: var(--muted); }

.sheet { min-width: 0; display: flex; flex-direction: column; gap: .75rem; }
.sheet h2 { margin: 0; font-size: .87rem; font-weight: 600; letter-spacing: .12em; color: var(--muted); }
.sheet h3 { margin: 0 0 .3rem; font-size: .8rem; font-weight: 400; color: var(--muted); }
.groups { display: flex; flex-direction: column; gap: .75rem; }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(2.1rem, 1fr)); gap: 4px; }
.cell { position: relative; height: 1.8rem; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; font-family: var(--font-num); font-size: .78rem; font-variant-numeric: tabular-nums; color: var(--ink); }
.cell.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.cell.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.cell.nk { border-style: dashed; color: var(--muted); }
.cell.st::after { content: ""; position: absolute; top: 2px; right: 2px; width: 5px; height: 5px; border-radius: 50%; background: var(--warn); }
.cell[aria-current="true"] { outline: 2px solid var(--accent); outline-offset: 1px; font-weight: 700; }
.reset { align-self: flex-start; border: 0; background: transparent; padding: .2rem 0; color: var(--muted); font-size: .87rem; text-decoration: underline; text-underline-offset: 3px; }
.reset.armed { color: var(--bad); font-weight: 600; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>健康教育与健康促进选择题库</h1>
    <div class="score" id="score"></div>
  </header>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>

  <div class="filters">
    <label class="sr" for="chapter">章节</label>
    <select id="chapter"></select>
    <div class="seg" id="scope" role="radiogroup" aria-label="题目范围"></div>
    <div class="togs">
      <button type="button" class="tog" id="random" aria-pressed="false">随机顺序</button>
      <button type="button" class="tog" id="recite" aria-pressed="false">背题模式</button>
    </div>
  </div>

  <main class="work">
    <article class="card" id="card" aria-live="polite"></article>
    <aside class="sheet" aria-label="答题卡">
      <h2>答题卡</h2>
      <div class="groups" id="sheet"></div>
      <button type="button" class="reset" id="reset">清空做题记录</button>
    </aside>
  </main>
</div>

ns":"E"},{"id":"12-24","ch":12,"stem":"下列运动不属于有氧运动的是","tags":[],"opts":["步行","慢跑","举重","舞蹈","游戏"],"ans":"C"},{"id":"12-25","ch":12,"stem":"在城市社区健康教育中，家庭健康教育的内容不包括","tags":[],"opts":["饮食卫生与营养","急救与护理","卫生法律法规","居室环境卫生","心理卫生"],"ans":"C"}]};
const CH = DATA.chapters, QS = DATA.qs;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

let rec = store.get('hq.rec', {});      // 题号 -> { s: 所选, r: 1 对 / 0 错 }
let stars = store.get('hq.star', {});
const ui = Object.assign({ ch: 0, scope: 'all', random: false, recite: false, cur: null }, store.get('hq.ui', {}));
let list = [], pos = 0, pick = new Set(), resetTimer = null;

const SCOPES = [['all', '全部'], ['todo', '未做'], ['wrong', '错题'], ['star', '收藏'], ['y24', '2024']];
const EMPTY = { all: '这一章没有题目。', todo: '这个范围的题已经全部做完。', wrong: '这个范围还没有错题。', star: '这个范围还没有收藏的题。', y24: '这一章没有 2024 年考过的题。' };
const is24 = q => q.tags.some(t => t.startsWith('2024'));
const inScope = (q, s) => s === 'all' || (s === 'todo' && q.ans && !rec[q.id]) || (s === 'wrong' && rec[q.id] && rec[q.id].r === 0) || (s === 'star' && stars[q.id]) || (s === 'y24' && is24(q));
const inCh = q => !ui.ch || q.ch === ui.ch;
const isGap = t => t === '……' || t === '（回忆缺失）';

function buildList(keepId) {
  list = QS.filter(q => inCh(q) && inScope(q, ui.scope));
  if (ui.random) for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  pos = Math.max(0, list.findIndex(q => q.id === keepId));
  pick.clear();
}
function saveUi() { ui.cur = list[pos] ? list[pos].id : null; store.set('hq.ui', ui); }

function renderFilters() {
  $('chapter').innerHTML = `<option value="0">全部章节（${QS.length}）</option>` +
    CH.map(c => `<option value="${c.n}">第${c.n}章 ${esc(c.name)}（${QS.filter(q => q.ch === c.n).length}）</option>`).join('');
  $('chapter').value = String(ui.ch);
  $('scope').innerHTML = SCOPES.map(([k, label]) =>
    `<button type="button" role="radio" data-scope="${k}" aria-checked="${ui.scope === k}">${label}<small>${QS.filter(q => inCh(q) && inScope(q, k)).length}</small></button>`).join('');
  $('random').setAttribute('aria-pressed', ui.random);
  $('recite').setAttribute('aria-pressed', ui.recite);
}

function renderScore() {
  const sc = list.filter(q => q.ans), done = sc.filter(q => rec[q.id]), right = done.filter(q => rec[q.id].r === 1);
  $('score').innerHTML = `<span>已做 <b>${done.length}</b> / ${sc.length}</span><span>正确率 <b>${done.length ? Math.round(right.length / done.length * 100) + '%' : '—'}</b></span>`;
  $('bar').style.width = (sc.length ? done.length / sc.length * 100 : 0) + '%';
}

function tagClass(t) { return t === '多选' ? 'tag multi' : t.startsWith('2024') ? 'tag y24' : t === '答案有争议' ? 'tag dispute' : 'tag'; }

function renderCard() {
  const el = $('card');
  if (!list.length) { el.innerHTML = `<p class="empty">${EMPTY[ui.scope]}</p>`; return; }
  const q = list[pos], r = rec[q.id], multi = q.ans.length > 1, nokey = !q.ans;
  const shown = !nokey && (ui.recite || !!r);
  const sel = r ? r.s : [...pick].join('');
  const opts = q.opts.map((t, i) => {
    const k = 'ABCDE'[i], gap = isGap(t);
    let cls = 'opt', mark = '';
    if (gap) cls += ' gap';
    if (shown && q.ans.includes(k)) { cls += ' right'; mark = '✓'; }
    else if (r && r.s.includes(k)) { cls += ' wrong'; mark = '✗'; }
    if (sel.includes(k)) cls += ' on';
    return `<button type="button" class="${cls}" data-k="${k}" aria-pressed="${sel.includes(k)}"${gap || nokey || shown ? ' disabled' : ''}><span class="bub">${k}</span><span class="txt">${esc(t)}</span><span class="mk" aria-hidden="true">${mark}</span></button>`;
  }).join('');

  let fb = '';
  if (nokey) fb = '<p class="fb none">来源未给出可靠答案。</p>';
  else if (r) fb = r.r ? '<p class="fb ok">回答正确</p>' : `<p class="fb bad">回答错误，正确答案 <b>${q.ans}</b></p>`;
  else if (ui.recite) fb = `<p class="fb">答案 <b>${q.ans}</b></p>`;
  if (shown && q.mark === '†') fb += '<p class="note">原卷未附答案，此答案按课件推定。</p>';
  if (shown && q.note) fb += `<p class="note warn">答案有争议：${esc(q.note)}</p>`;

  const ch = CH.find(c => c.n === q.ch);
  el.innerHTML = `
    <div class="qhead">
      <span class="qid">${q.id}</span><span>第${ch.n}章 ${esc(ch.name)}</span>
      ${q.tags.map(t => `<span class="${tagClass(t)}">${esc(t)}</span>`).join('')}
      <button type="button" class="star" id="star" aria-pressed="${!!stars[q.id]}">${stars[q.id] ? '★ 已收藏' : '☆ 收藏'}</button>
    </div>
    <p class="stem">${esc(q.stem)}</p>
    <div class="opts">${opts}</div>
    ${fb ? `<div class="fbwrap">${fb}</div>` : ''}
    <div class="acts">
      <button type="button" id="prev"${pos === 0 ? ' disabled' : ''}>上一题</button>
      ${multi && !shown ? `<button type="button" id="submit" class="primary"${pick.size ? '' : ' disabled'}>提交</button>` : ''}
      ${r ? '<button type="button" id="redo">重做</button>' : ''}
      <span class="pos">${pos + 1} / ${list.length}</span>
      <button type="button" id="next" class="${shown || nokey ? 'primary' : ''}"${pos === list.length - 1 ? ' disabled' : ''}>下一题</button>
    </div>`;
}

function cellHtml(q, i, label) {
  const r = rec[q.id];
  const cls = ['cell', !q.ans ? 'nk' : r ? (r.r ? 'ok' : 'bad') : '', stars[q.id] ? 'st' : ''].filter(Boolean).join(' ');
  return `<button type="button" class="${cls}" data-i="${i}" aria-label="第 ${q.id} 题"${i === pos ? ' aria-current="true"' : ''}>${label}</button>`;
}
function renderSheet() {
  let html = '';
  if (ui.random) html = `<div class="cells">${list.map((q, i) => cellHtml(q, i, i + 1)).join('')}</div>`;
  else for (const c of CH) {
    const cells = list.map((q, i) => q.ch === c.n ? cellHtml(q, i, q.id.split('-')[1]) : '').join('');
    if (cells) html += `<div><h3>第${c.n}章 ${esc(c.name)}</h3><div class="cells">${cells}</div></div>`;
  }
  $('sheet').innerHTML = html;
}

function render() { renderFilters(); renderScore(); renderCard(); renderSheet(); saveUi(); }
function refilter() { buildList(list[pos] ? list[pos].id : null); render(); }

function go(d) { const n = pos + d; if (n < 0 || n >= list.length) return; pos = n; pick.clear(); render(); }
function grade(s) { const q = list[pos]; rec[q.id] = { s, r: s === q.ans ? 1 : 0 }; store.set('hq.rec', rec); pick.clear(); render(); }
function choose(k) {
  const q = list[pos];
  if (!q || !q.ans || rec[q.id] || ui.recite) return;
  const i = 'ABCDE'.indexOf(k);
  if (i < 0 || isGap(q.opts[i])) return;
  if (q.ans.length > 1) { pick.has(k) ? pick.delete(k) : pick.add(k); pick = new Set([...pick].sort()); render(); }
  else grade(k);
}
function submit() { if (pick.size) grade([...pick].join('')); }

$('card').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.k) choose(b.dataset.k);
  else if (b.id === 'prev') go(-1);
  else if (b.id === 'next') go(1);
  else if (b.id === 'submit') submit();
  else if (b.id === 'redo') { delete rec[list[pos].id]; store.set('hq.rec', rec); render(); }
  else if (b.id === 'star') { const id = list[pos].id; stars[id] ? delete stars[id] : stars[id] = 1; store.set('hq.star', stars); render(); }
});
$('sheet').addEventListener('click', e => {
  const b = e.target.closest('[data-i]'); if (!b) return;
  pos = +b.dataset.i; pick.clear(); render();
  if ($('card').getBoundingClientRect().top < 0) $('card').scrollIntoView({ block: 'start' });
});
$('chapter').addEventListener('change', e => { ui.ch = +e.target.value; refilter(); });
$('scope').addEventListener('click', e => { const b = e.target.closest('[data-scope]'); if (!b) return; ui.scope = b.dataset.scope; refilter(); });
$('random').addEventListener('click', () => { ui.random = !ui.random; refilter(); });
$('recite').addEventListener('click', () => { ui.recite = !ui.recite; pick.clear(); render(); });
$('reset').addEventListener('click', () => {
  const b = $('reset');
  clearTimeout(resetTimer);
  if (b.classList.contains('armed')) {
    rec = {}; store.set('hq.rec', rec);
    b.classList.remove('armed'); b.textContent = '清空做题记录';
    refilter();
  } else {
    b.classList.add('armed'); b.textContent = '再点一次，清空全部做题记录';
    resetTimer = setTimeout(() => { b.classList.remove('armed'); b.textContent = '清空做题记录'; }, 4000);
  }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = e.target.tagName;
  if (tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA') return;
  const k = e.key.length === 1 ? e.key.toUpperCase() : e.key;
  if ('ABCDE'.includes(k)) choose(k);
  else if ('12345'.includes(k)) choose('ABCDE'[+k - 1]);
  else if (k === 'ArrowRight') go(1);
  else if (k === 'ArrowLeft') go(-1);
  else if (k === 'Enter' && tag !== 'BUTTON') { const q = list[pos]; (q && q.ans.length > 1 && !rec[q.id] && !ui.recite && pick.size) ? submit() : go(1); }
});

buildList(ui.cur);
render();
</script>
</body>
</html>
